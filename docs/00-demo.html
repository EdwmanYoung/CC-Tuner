<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Switcher · Claude Code</title>
  <!-- Fluent UI Web Components -->
  <script type="module" src="https://unpkg.com/@fluentui/web-components"></script>

  <!-- Apple 设计令牌 -->
  <style>
    :root {
      --color-canvas: #ffffff;
      --color-canvas-parchment: #f5f5f7;
      --color-surface-pearl: #fafafc;
      --color-ink: #1d1d1f;
      --color-ink-muted: #86868b;
      --color-action-blue: #0066cc;
      --color-focus-blue: #0071e3;
      --color-hairline: rgba(0, 0, 0, 0.08);
      --color-divider-soft: rgba(0, 0, 0, 0.04);
      --font-display: "SF Pro Display", system-ui, -apple-system, sans-serif;
      --font-text: "SF Pro Text", system-ui, -apple-system, sans-serif;
      --font-size-body: 15px;
      --font-size-caption: 13px;
      --font-size-headline: 17px;
      --font-size-large: 20px;
      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 20px;
      --space-lg: 32px;
      --space-xl: 48px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-pill: 980px;
      --shadow-product: 0 3px 5px rgba(0, 0, 0, 0.22), 0 5px 30px rgba(0, 0, 0, 0.08);
    }

    body {
      margin: 0;
      font-family: var(--font-text);
      font-size: var(--font-size-body);
      color: var(--color-ink);
      background: var(--color-canvas-parchment);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .title-bar {
      height: 38px;
      background: var(--color-canvas-parchment);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--color-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      -webkit-app-region: drag;
      user-select: none;
    }
    .title-bar .app-name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: -0.08px;
      color: var(--color-ink);
    }
    .window-controls {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    .window-controls fluent-button {
      min-width: 24px;
      height: 24px;
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .side-nav {
      width: 240px;
      background: var(--color-canvas-parchment);
      backdrop-filter: saturate(180%) blur(20px);
      border-right: 1px solid var(--color-hairline);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .side-nav-header {
      padding: 28px 24px 12px;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.08px;
      color: var(--color-ink-muted);
      text-transform: uppercase;
    }
    fluent-tree-view {
      flex: 1;
      padding: 0 12px;
    }
    fluent-tree-item {
      font-size: 14px;
      font-weight: 400;
      color: var(--color-ink);
      margin: 2px 0;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--color-canvas);
      overflow: hidden;
    }

    .command-bar {
      background: var(--color-canvas);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--color-hairline);
      backdrop-filter: saturate(180%) blur(20px);
    }
    .command-bar fluent-search {
      flex: 1;
      max-width: 300px;
    }

    .cards-grid {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      align-content: start;
    }

    .profile-card {
      background: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-lg);
      padding: 28px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .profile-card:hover {
      border-color: rgba(0, 0, 0, 0.15);
    }
    .profile-card:active {
      transform: scale(0.99);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 18px;
      letter-spacing: -0.25px;
    }
    .card-badge {
      background: var(--color-action-blue);
      color: white;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      letter-spacing: -0.04px;
    }
    .card-info {
      color: var(--color-ink-muted);
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .detail-panel {
      width: 360px;
      background: var(--color-canvas-parchment);
      border-left: 1px solid var(--color-hairline);
      backdrop-filter: saturate(180%) blur(20px);
      padding: 32px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .detail-panel h3 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 20px;
      letter-spacing: -0.28px;
      margin: 0;
    }
    .detail-panel pre {
      background: var(--color-canvas);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius-md);
      padding: 16px;
      font-size: 13px;
      line-height: 1.5;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .status-bar {
      height: 32px;
      background: var(--color-canvas-parchment);
      backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--color-hairline);
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: 12px;
      font-weight: 400;
      color: var(--color-ink-muted);
      letter-spacing: -0.08px;
      gap: 16px;
    }

    fluent-dialog::part(control) {
      min-width: 520px;
      border-radius: var(--radius-lg);
      border: none;
      box-shadow: var(--shadow-product);
    }
    .form-field {
      margin-bottom: 16px;
    }
    .form-field label {
      display: block;
      font-weight: 500;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--color-ink);
    }
    .form-field fluent-text-field,
    .form-field fluent-select {
      width: 100%;
    }

    /* 环境变量表格 */
    .env-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    .env-table th, .env-table td {
      text-align: left;
      padding: 6px 8px;
      font-size: 13px;
      border-bottom: 1px solid var(--color-hairline);
    }
    .env-table th {
      color: var(--color-ink-muted);
      font-weight: 500;
    }
    .env-table fluent-text-field {
      width: 100%;
    }
    .env-table .delete-env-btn {
      color: var(--color-ink-muted);
      cursor: pointer;
    }

    details summary {
      font-weight: 500;
      font-size: 14px;
      color: var(--color-ink);
      cursor: pointer;
      margin-top: 16px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <!-- 标题栏 -->
  <div class="title-bar">
    <span class="app-name">Claude Code Model Switcher</span>
    <div class="window-controls">
      <fluent-button appearance="stealth" icon-only>
        <svg slot="start" width="12" height="12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5"/></svg>
      </fluent-button>
      <fluent-button appearance="stealth" icon-only>
        <svg slot="start" width="12" height="12"><rect x="2" y="2" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </fluent-button>
      <fluent-button appearance="stealth" icon-only>
        <svg slot="start" width="12" height="12"><line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.5"/></svg>
      </fluent-button>
    </div>
  </div>

  <!-- 主容器 -->
  <div class="main-container">
    <!-- 侧边导航 -->
    <div class="side-nav">
      <div class="side-nav-header">Providers</div>
      <fluent-tree-view>
        <fluent-tree-item expanded>
          <span>Anthropic</span>
          <fluent-tree-item selected><span>Claude Official</span></fluent-tree-item>
        </fluent-tree-item>
        <fluent-tree-item>
          <span>OpenRouter</span>
          <fluent-tree-item><span>Claude 3.5</span></fluent-tree-item>
          <fluent-tree-item><span>GPT-4o</span></fluent-tree-item>
        </fluent-tree-item>
        <fluent-tree-item>
          <span>DeepSeek</span>
          <fluent-tree-item><span>DeepSeek V3</span></fluent-tree-item>
        </fluent-tree-item>
      </fluent-tree-view>
    </div>

    <!-- 内容区 -->
    <div class="content-area">
      <!-- 命令栏 -->
      <div class="command-bar">
        <fluent-search placeholder="搜索配置方案..."></fluent-search>
        <fluent-button appearance="accent" id="newProfileBtn" style="border-radius: var(--radius-pill); padding: 8px 18px; font-weight: 500;">
          <svg slot="start" width="16" height="16" viewBox="0 0 16 16"><path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2z" fill="currentColor"/></svg>
          新建方案
        </fluent-button>
        <fluent-button id="launchClaudeBtn" style="border-radius: var(--radius-pill); padding: 8px 18px; font-weight: 500;">
          启动 Claude Code
        </fluent-button>
      </div>

      <!-- 卡片网格 -->
      <div class="cards-grid" id="cardsContainer"></div>

      <!-- 详情面板 -->
      <div class="detail-panel" id="detailPanel" style="display: none;">
        <h3 id="detailName">方案详情</h3>
        <pre id="detailJson">选择一个方案查看详情</pre>
        <fluent-button appearance="accent" id="switchBtn" style="width:100%; border-radius: var(--radius-pill); padding: 10px 0; font-weight: 500;">
          使用此方案
        </fluent-button>
      </div>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <span>当前激活：<strong id="activeProfileName" style="color: var(--color-ink);">Claude Official</strong></span>
    <span>|</span>
    <span>最后备份：2026-05-27 12:00</span>
  </div>

  <!-- 编辑方案对话框 -->
  <fluent-dialog id="editDialog" hidden>
    <div slot="dialog" style="padding: 8px;">
      <h2 id="dialogTitle" style="font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: -0.28px; margin: 0 0 24px;">新建配置方案</h2>
      
      <div class="form-field">
        <label for="profileName">方案名称 *</label>
        <fluent-text-field id="profileName" placeholder="例如：DeepSeek V3"></fluent-text-field>
      </div>
      <div class="form-field">
        <label for="provider">提供商</label>
        <fluent-select id="provider">
          <fluent-option value="anthropic">Anthropic</fluent-option>
          <fluent-option value="openai">OpenAI Compatible</fluent-option>
          <fluent-option value="custom">自定义</fluent-option>
        </fluent-select>
      </div>
      
      <!-- 核心环境变量字段 -->
      <fieldset style="border: none; padding: 0; margin: 0;">
        <legend style="font-weight: 600; font-size: 14px; margin-bottom: 12px;">基本环境变量</legend>
        <div class="form-field">
          <label for="apiKey">ANTHROPIC_AUTH_TOKEN</label>
          <fluent-text-field id="apiKey" type="password" placeholder="sk-..." autocomplete="off"></fluent-text-field>
        </div>
        <div class="form-field">
          <label for="baseUrl">ANTHROPIC_BASE_URL *</label>
          <fluent-text-field id="baseUrl" placeholder="https://api.anthropic.com"></fluent-text-field>
        </div>
        <div class="form-field">
          <label for="model">ANTHROPIC_MODEL *</label>
          <fluent-text-field id="model" placeholder="claude-sonnet-4-20250514"></fluent-text-field>
        </div>
      </fieldset>

      <!-- 高级环境变量区域（可折叠） -->
      <details id="advancedEnvDetails" style="margin-top: 16px;">
        <summary>高级环境变量（可展开编辑）</summary>
        <div style="margin-top: 8px;">
          <table class="env-table" id="envTable">
            <thead>
              <tr>
                <th>变量名</th>
                <th>值</th>
                <th style="width: 40px;"></th>
              </tr>
            </thead>
            <tbody id="envTableBody">
              <!-- 动态生成 -->
            </tbody>
          </table>
          <fluent-button appearance="stealth" id="addEnvVarBtn" style="margin-top: 8px; font-size: 13px;">
            + 添加变量
          </fluent-button>
        </div>
      </details>

      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
        <fluent-button id="testConnectionBtn" style="border-radius: var(--radius-pill); padding: 8px 18px;">测试连接</fluent-button>
        <fluent-button appearance="accent" id="saveProfileBtn" style="border-radius: var(--radius-pill); padding: 8px 18px;">保存方案</fluent-button>
        <fluent-button id="cancelDialogBtn" style="border-radius: var(--radius-pill); padding: 8px 18px;">取消</fluent-button>
      </div>
    </div>
  </fluent-dialog>

  <script>
    // 完整的 settings.json 结构方案
    const initialSettings = {
      env: {
        "ANTHROPIC_AUTH_TOKEN": "sk-sp-f765e6d0a31d492f9af5f55e581b7606",
        "ANTHROPIC_BASE_URL": "https://coding.dashscope.aliyuncs.com/apps/anthropic",
        "ANTHROPIC_MODEL": "qwen3.5-plus",
        "ANTHROPIC_SMALL_FAST_MODEL": "qwen3.5-plus",
        "ANTHROPIC_DEFAULT_HAIKU_MODEL": "qwen3.5-plus",
        "ANTHROPIC_DEFAULT_SONNET_MODEL": "qwen3.5-plus",
        "ANTHROPIC_DEFAULT_OPUS_MODEL": "qwen3.5-plus",
        "CLAUDE_CODE_SUBAGENT_MODEL": "qwen3.5-plus"
      },
      enabledPlugins: {
        "rust-analyzer-lsp@claude-plugins-official": true
      }
    };

    const profiles = [
      {
        name: 'Claude Official',
        provider: 'Anthropic',
        settings: {
          env: {
            "ANTHROPIC_AUTH_TOKEN": "sk-ant-...",
            "ANTHROPIC_BASE_URL": "https://api.anthropic.com",
            "ANTHROPIC_MODEL": "claude-sonnet-4-20250514",
            "ANTHROPIC_SMALL_FAST_MODEL": "claude-haiku-4-20250514",
            "ANTHROPIC_DEFAULT_HAIKU_MODEL": "claude-haiku-4-20250514",
            "ANTHROPIC_DEFAULT_SONNET_MODEL": "claude-sonnet-4-20250514",
            "ANTHROPIC_DEFAULT_OPUS_MODEL": "claude-opus-4-20250514",
            "CLAUDE_CODE_SUBAGENT_MODEL": "claude-haiku-4-20250514"
          },
          enabledPlugins: {}
        },
        active: true
      },
      {
        name: 'Qwen (DashScope)',
        provider: 'Alibaba Cloud',
        settings: initialSettings,
        active: false
      },
      {
        name: 'OpenRouter Claude',
        provider: 'OpenRouter',
        settings: {
          env: {
            "ANTHROPIC_AUTH_TOKEN": "sk-or-...",
            "ANTHROPIC_BASE_URL": "https://openrouter.ai/api/v1",
            "ANTHROPIC_MODEL": "anthropic/claude-3.5-sonnet",
            "ANTHROPIC_SMALL_FAST_MODEL": "anthropic/claude-3-haiku",
            "ANTHROPIC_DEFAULT_HAIKU_MODEL": "anthropic/claude-3-haiku",
            "ANTHROPIC_DEFAULT_SONNET_MODEL": "anthropic/claude-3.5-sonnet",
            "ANTHROPIC_DEFAULT_OPUS_MODEL": "anthropic/claude-3-opus",
            "CLAUDE_CODE_SUBAGENT_MODEL": "anthropic/claude-3-haiku"
          },
          enabledPlugins: {}
        },
        active: false
      }
    ];

    // 工具函数
    function getEnvValue(profile, key, fallback = '') {
      return profile.settings?.env?.[key] ?? fallback;
    }

    // 渲染卡片
    function renderCards() {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = profiles.map(p => {
        const baseUrl = getEnvValue(p, 'ANTHROPIC_BASE_URL');
        const model = getEnvValue(p, 'ANTHROPIC_MODEL');
        return `
          <div class="profile-card" data-name="${p.name}">
            <div class="card-header">
              <span class="card-title">${p.name}</span>
              ${p.active ? '<span class="card-badge">使用中</span>' : ''}
            </div>
            <div class="card-info">
              <div>${p.provider}</div>
              <div style="word-break: break-all;">${baseUrl}</div>
              <div>${model}</div>
            </div>
            <div class="card-actions">
              <fluent-button size="small" class="switch-btn" ${p.active ? 'disabled' : ''} 
                style="border-radius: var(--radius-pill); font-weight: 500;">切换</fluent-button>
              <fluent-button size="small" appearance="stealth" class="edit-btn">编辑</fluent-button>
              <fluent-button size="small" appearance="stealth" class="delete-btn">删除</fluent-button>
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.profile-card').forEach(card => {
        const name = card.dataset.name;
        card.addEventListener('click', (e) => {
          if (e.target.closest('fluent-button')) return;
          showDetail(name);
        });
        card.querySelector('.switch-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          switchProfile(name);
        });
        card.querySelector('.edit-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          openEditor(name);
        });
        card.querySelector('.delete-btn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteProfile(name);
        });
      });
    }

    function showDetail(name) {
      const profile = profiles.find(p => p.name === name);
      if (!profile) return;
      const panel = document.getElementById('detailPanel');
      panel.style.display = 'flex';
      document.getElementById('detailName').textContent = name;
      document.getElementById('detailJson').textContent = JSON.stringify(profile.settings, null, 2);
      document.getElementById('switchBtn').onclick = () => switchProfile(name);
    }

    function switchProfile(name) {
      profiles.forEach(p => p.active = false);
      const target = profiles.find(p => p.name === name);
      if (target) {
        target.active = true;
        document.getElementById('activeProfileName').textContent = name;
        renderCards();
        showDetail(name);
        console.log('Switched to profile:', name, 'Full settings:', target.settings);
      }
    }

    // 高级环境变量表格操作
    function buildEnvRows(envObj) {
      const tbody = document.getElementById('envTableBody');
      tbody.innerHTML = '';
      if (!envObj) return;
      Object.entries(envObj).forEach(([key, value]) => {
        const row = tbody.insertRow();
        row.innerHTML = `
          <td><fluent-text-field value="${escapeHtml(key)}" class="env-key" style="width:100%;"></fluent-text-field></td>
          <td><fluent-text-field value="${escapeHtml(value)}" class="env-value" style="width:100%;"></fluent-text-field></td>
          <td><fluent-button appearance="stealth" class="delete-env-btn" style="min-width:24px;">✕</fluent-button></td>
        `;
        row.querySelector('.delete-env-btn').addEventListener('click', () => row.remove());
      });
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return m;
      });
    }

    function getCurrentEnvFromForm() {
      const env = {};
      // 基本字段
      const baseKeys = {
        'apiKey': 'ANTHROPIC_AUTH_TOKEN',
        'baseUrl': 'ANTHROPIC_BASE_URL',
        'model': 'ANTHROPIC_MODEL'
      };
      for (const [id, envKey] of Object.entries(baseKeys)) {
        const val = document.getElementById(id).value.trim();
        if (val) env[envKey] = val;
      }
      // 高级表格中的变量
      const rows = document.querySelectorAll('#envTableBody tr');
      rows.forEach(row => {
        const keyInput = row.querySelector('.env-key');
        const valueInput = row.querySelector('.env-value');
        if (keyInput && valueInput) {
          const key = keyInput.value.trim();
          if (key) env[key] = valueInput.value;
        }
      });
      return env;
    }

    function openEditor(name = null) {
      const dialog = document.getElementById('editDialog');
      dialog.hidden = false;
      
      // 重置高级区域
      const envTableBody = document.getElementById('envTableBody');
      envTableBody.innerHTML = '';
      document.getElementById('advancedEnvDetails').open = false;

      if (name) {
        document.getElementById('dialogTitle').textContent = '编辑配置方案';
        const profile = profiles.find(p => p.name === name);
        if (profile) {
          document.getElementById('profileName').value = profile.name;
          document.getElementById('provider').value = profile.provider;
          const env = profile.settings.env || {};
          document.getElementById('apiKey').value = env['ANTHROPIC_AUTH_TOKEN'] || '';
          document.getElementById('baseUrl').value = env['ANTHROPIC_BASE_URL'] || '';
          document.getElementById('model').value = env['ANTHROPIC_MODEL'] || '';
          
          // 将除基本三个之外的所有env变量加载到高级表格
          const basicKeys = ['ANTHROPIC_AUTH_TOKEN', 'ANTHROPIC_BASE_URL', 'ANTHROPIC_MODEL'];
          const advancedEnv = {};
          for (const [key, value] of Object.entries(env)) {
            if (!basicKeys.includes(key)) {
              advancedEnv[key] = value;
            }
          }
          buildEnvRows(advancedEnv);
        }
        dialog.dataset.editName = name;
      } else {
        document.getElementById('dialogTitle').textContent = '新建配置方案';
        document.getElementById('profileName').value = '';
        document.getElementById('provider').value = 'custom';
        document.getElementById('apiKey').value = '';
        document.getElementById('baseUrl').value = '';
        document.getElementById('model').value = '';
        dialog.dataset.editName = '';
      }
    }

    function closeEditor() {
      document.getElementById('editDialog').hidden = true;
    }

    function saveProfile() {
      const dialog = document.getElementById('editDialog');
      const editName = dialog.dataset.editName;
      const newName = document.getElementById('profileName').value.trim();
      const provider = document.getElementById('provider').value;
      if (!newName) {
        alert('请输入方案名称');
        return;
      }
      
      const env = getCurrentEnvFromForm();
      if (!env['ANTHROPIC_BASE_URL'] || !env['ANTHROPIC_MODEL']) {
        alert('API 基础 URL 和默认模型为必填项');
        return;
      }

      const newSettings = {
        env: env,
        enabledPlugins: {} // 实际应用可继承或保留，此处简化
      };

      if (editName) {
        const idx = profiles.findIndex(p => p.name === editName);
        if (idx !== -1) {
          profiles[idx] = {
            ...profiles[idx],
            name: newName,
            provider: provider,
            settings: newSettings,
            active: profiles[idx].active
          };
        }
      } else {
        // 检查重名
        if (profiles.some(p => p.name === newName)) {
          alert('方案名称已存在');
          return;
        }
        profiles.push({
          name: newName,
          provider: provider,
          settings: newSettings,
          active: false
        });
      }
      closeEditor();
      renderCards();
    }

    function deleteProfile(name) {
      if (confirm(`确认删除方案“${name}”？`)) {
        const idx = profiles.findIndex(p => p.name === name);
        if (idx !== -1) profiles.splice(idx, 1);
        renderCards();
        document.getElementById('detailPanel').style.display = 'none';
      }
    }

    // 添加高级环境变量行
    function addEnvRow(key = '', value = '') {
      const tbody = document.getElementById('envTableBody');
      const row = tbody.insertRow();
      row.innerHTML = `
        <td><fluent-text-field value="${escapeHtml(key)}" class="env-key" style="width:100%;"></fluent-text-field></td>
        <td><fluent-text-field value="${escapeHtml(value)}" class="env-value" style="width:100%;"></fluent-text-field></td>
        <td><fluent-button appearance="stealth" class="delete-env-btn" style="min-width:24px;">✕</fluent-button></td>
      `;
      row.querySelector('.delete-env-btn').addEventListener('click', () => row.remove());
    }

    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      renderCards();
      document.getElementById('newProfileBtn').addEventListener('click', () => openEditor());
      document.getElementById('cancelDialogBtn').addEventListener('click', closeEditor);
      document.getElementById('saveProfileBtn').addEventListener('click', saveProfile);
      document.getElementById('launchClaudeBtn').addEventListener('click', () => console.log('启动 Claude Code 终端'));
      document.getElementById('testConnectionBtn').addEventListener('click', () => alert('测试连接功能（模拟）'));
      document.getElementById('addEnvVarBtn').addEventListener('click', () => addEnvRow());
    });
  </script>
</body>
</html>
